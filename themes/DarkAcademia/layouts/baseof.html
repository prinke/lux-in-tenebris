<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}{{ with .Section }} topic-{{ . }}{{ end }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{- if ne site.Params.marginArt false }}
  <div class="margin-art left" aria-hidden="true"></div>
  <div class="margin-art right" aria-hidden="true"></div>
  {{- end }}
  <div class="page">
    {{ partial "header.html" . }}
    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </div>
  {{ partialCached "head/js.html" . }}
  {{ partial "scripttagger.html" . }}
</body>
</html>
